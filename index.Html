<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت — مافیا توکیو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --line:#e3e7ec; --line-2:#cfd6df;
  --text:#111721; --muted:#697383; --faint:#98a2b3;
  --accent:#2563eb; --accent-soft:#eaf0ff;
  --ok:#0f7b52; --ok-soft:#e7f5ee;
  --warn:#b45309; --warn-soft:#fdf2e3;
  --danger:#b42318; --danger-soft:#fdeceb;
  --info:#1d4ed8; --info-soft:#eaf0ff;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.75;
  font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;
}
.app{display:grid;grid-template-columns:266px 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{background:var(--panel);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand-mark{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:#f8fafc;
  display:grid;place-items:center;color:var(--accent);flex:0 0 auto
}
.brand-mark svg{width:18px;height:18px}
.brand-txt strong{display:block;font-size:13.5px;letter-spacing:-.01em}
.brand-txt span{display:block;font-size:11px;color:var(--faint)}
.nav{overflow-y:auto;padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font:inherit;cursor:pointer;text-align:start;transition:.14s
}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;opacity:.85}
.nav-item:hover{background:#f3f6fa;color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.active svg{opacity:1}
.sidebar-foot{border-top:1px solid var(--line);padding:11px 14px;font-size:11.5px;color:var(--faint);line-height:1.6}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap
}
.page-title{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0}
.spacer{flex:1}
.role-badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line-2);background:#f8fafc;font-size:11.5px;color:var(--muted)
}
.role-badge b{color:var(--text);font-weight:600}
select,input,textarea{
  font:inherit;color:var(--text);background:#fff;border:1px solid var(--line-2);
  border-radius:8px;padding:7px 10px;outline:none;transition:.14s
}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.content{padding:20px 22px 40px;display:flex;flex-direction:column;gap:14px;max-width:1500px}

/* ---------- grids ---------- */
.grid{display:grid;gap:14px}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- kpi ---------- */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px}
.kpi-label{font-size:11.5px;color:var(--muted)}
.kpi-value{font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.35}
.kpi-hint{font-size:11px;color:var(--faint)}
.kpi.ok .kpi-value{color:var(--ok)}
.kpi.warn .kpi-value{color:var(--warn)}
.kpi.danger .kpi-value{color:var(--danger)}

/* ---------- panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:-.01em}
.panel-body{padding:14px 15px}
.panel-body.flush{padding:0}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{
  text-align:start;font-weight:600;color:var(--muted);font-size:11.5px;
  padding:9px 14px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap
}
tbody td{padding:10px 14px;border-bottom:1px solid #eef1f5;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfd}
td.empty, .empty{text-align:center;color:var(--faint);padding:26px 10px}
.sub{font-size:11px;color:var(--faint)}

/* ---------- pill ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:#cdeada}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:#f3ddbd}
.pill.danger{color:var(--danger);background:var(--danger-soft);border-color:#f6cfcb}
.pill.info{color:var(--info);background:var(--info-soft);border-color:#d3e0fe}
.pill.neutral{color:var(--muted);background:#f2f4f7;border-color:#e4e8ee}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line-2);background:#fff;color:var(--text);font:inherit;font-size:12px;transition:.14s
}
.btn:hover{border-color:#b9c2cd;background:#fafbfd}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d55d0}
.btn.danger{background:#fff;border-color:#f0c2bd;color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#f2f5f9;color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f5}
.list-row:last-child{border-bottom:0;padding-bottom:0}
.list-row:first-child{padding-top:0}
.list-main{flex:1;min-width:0}
.list-main strong{display:block;font-size:12.5px;font-weight:600}
.list-main span{font-size:11.5px;color:var(--muted)}
.list-time{font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:0 0 auto;background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.danger{background:var(--danger)} .dot.info{background:var(--accent)}

/* ---------- role cards ---------- */
.role-card{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:#fcfdfe;display:flex;flex-direction:column;gap:8px}
.role-card header{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
.role-card header svg{width:17px;height:17px;color:var(--accent)}
.role-card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.65}
.role-card .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);border-top:1px dashed var(--line);padding-top:8px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field > label{font-size:11.5px;color:var(--muted);font-weight:600}
.field textarea{resize:vertical;min-height:74px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f5}
.switch-row:last-child{border-bottom:0}
.switch-row .t{font-size:12.5px}
.switch-row .d{font-size:11px;color:var(--faint)}
.muted{color:var(--muted);font-size:12px;margin:0}
.note{border:1px solid var(--line);background:#fafbfc;border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--muted)}
.note b{color:var(--text)}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(17,23,33,.38);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px}
.modal{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 24px 60px rgba(16,24,40,.22)}
.modal h3{margin:0 0 4px;font-size:14px}
.modal .modal-sub{font-size:11.5px;color:var(--faint);margin:0 0 14px}
.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:16px}
.toast-root{position:fixed;bottom:20px;left:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{
  background:#111721;color:#fff;padding:9px 14px;border-radius:9px;font-size:12px;
  box-shadow:0 10px 26px rgba(16,24,40,.24);animation:in .18s ease-out
}
.toast.warn{background:#8a4a07} .toast.danger{background:#96201a} .toast.out{opacity:0;transform:translateY(6px);transition:.22s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1150px){ .k4{grid-template-columns:repeat(2,minmax(0,1fr))} .k3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-left:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:6px}
  .nav-item{white-space:nowrap;padding:8px 11px}
  .sidebar-foot{display:none}
  .k2,.k3,.k4{grid-template-columns:1fr}
  .content{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <div class="brand-txt"><strong>مافیا توکیو</strong><span>پنل مدیریت</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 class="page-title" id="pageTitle">داشبورد</h1>
      <div class="spacer"></div>
      <span class="role-badge">نقش فعال: <b id="roleName">سازنده</b></span>
      <select id="roleSwitch" aria-label="تعویض نقش">
        <option value="creator">سازنده / مالک</option>
        <option value="admin">ادمین</option>
        <option value="moderator">ناظر</option>
        <option value="support">پشتیبانی</option>
      </select>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script>
/* =========================================================
   ICONS — خطی، فنی، بدون هیچ المان تصویری/فرهنگی
   ========================================================= */
const I = {
  dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6S14 16 14.6 19"/><path d="M16 5.2a3 3 0 0 1 0 5.6"/><path d="M17.6 14.7c1.9.6 3 2 3.4 4.3"/>',
  shield:'<path d="M12 3.4 5 6v5.3c0 4 2.9 7.4 7 8.3 4.1-.9 7-4.3 7-8.3V6l-7-2.6Z"/><path d="m9.2 12.1 2 2 3.6-4"/>',
  target:'<circle cx="12" cy="12" r="7.6"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  headphones:'<path d="M4 14.5V12a8 8 0 0 1 16 0v2.5"/><rect x="2.6" y="14" width="4" height="6.2" rx="2"/><rect x="17.4" y="14" width="4" height="6.2" rx="2"/>',
  game:'<rect x="3" y="5" width="18" height="14" rx="3.2"/><path d="M8 10.2v3.6M6.2 12h3.6"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="14.2" r="1"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2.6"/><path d="M3 10.4h18"/><circle cx="17" cy="14.8" r="1.2"/>',
  chart:'<path d="M4 20V9M10 20V4.5M16 20v-7M22 20H2"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.2 6h.01M3.2 12h.01M3.2 18h.01"/>',
  sliders:'<path d="M5 4v5.6M5 14.4V20M12 4v2.6M12 11.4V20M19 4v9.6M19 18v2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="9" r="2"/><circle cx="19" cy="16" r="2"/>',
  lock:'<rect x="4.5" y="10" width="15" height="10.2" rx="2.6"/><path d="M8 10V7.6a4 4 0 0 1 8 0V10"/>',
  ticket:'<path d="M4 8.6A2.6 2.6 0 0 1 6.6 6h10.8A2.6 2.6 0 0 1 20 8.6v.9a2.5 2.5 0 0 0 0 5v.9a2.6 2.6 0 0 1-2.6 2.6H6.6A2.6 2.6 0 0 1 4 15.4v-.9a2.5 2.5 0 0 0 0-5v-.9Z"/><path d="M12 9.2v5.6"/>',
  bell:'<path d="M6 9.4a6 6 0 0 1 12 0c0 3.7 1.4 5.2 1.4 5.2H4.6S6 13.1 6 9.4Z"/><path d="M9.6 18a2.5 2.5 0 0 0 4.8 0"/>',
  search:'<circle cx="11" cy="11" r="6.6"/><path d="m20 20-4.2-4.2"/>',
  check:'<circle cx="12" cy="12" r="8.6"/><path d="m8.4 12.4 2.5 2.5 4.7-5.6"/>',
  rotate:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.2 4.2v4.2h-4.2"/>',
  flag:'<path d="M6 21V4M6 4h9l-1.6 3.4L15 11H6"/>',
  server:'<rect x="3" y="4" width="18" height="6.2" rx="2"/><rect x="3" y="13.8" width="18" height="6.2" rx="2"/><path d="M6.8 7.1h.01M6.8 16.9h.01"/>',
  alert:'<path d="M12 4.2 2.9 20h18.2L12 4.2Z"/><path d="M12 10v4.2M12 17.2h.01"/>',
  ban:'<circle cx="12" cy="12" r="8.6"/><path d="m6.4 17.6 11.2-11.2"/>',
  history:'<path d="M3.6 12a8.6 8.6 0 1 0 2.7-6.2"/><path d="M3.2 4.2v4.2h4.2"/><path d="M12 8v4.6l3.2 1.9"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3.6 12.6 8.4 4.7 8.4-4.7"/>',
  play:'<path d="M8 5.5 19 12 8 18.5v-13Z"/>',
  eye:'<path d="M2.6 12S6 5.8 12 5.8 21.4 12 21.4 12 18 18.2 12 18.2 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="2.8"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||''}</svg>`;

/* =========================================================
   ROLES + MENUS (دقیقاً بر اساس اسکوپ تعریف‌شده)
   ========================================================= */
const ROLES = {
  creator:{
    label:'سازنده / مالک', short:'سازنده',
    foot:'<b>دسترسی کامل سیستم.</b> مدیریت تمام نقش‌ها، اقتصاد، تنظیمات و زیرساخت.',
    menus:[
      {id:'dashboard', label:'داشبورد',            icon:'dashboard'},
      {id:'users',     label:'مدیریت کاربران',      icon:'users'},
      {id:'admins',    label:'مدیریت ادمین‌ها',     icon:'shield'},
      {id:'mods',      label:'مدیریت ناظران',       icon:'target'},
      {id:'supports',  label:'مدیریت پشتیبانی',     icon:'headphones'},
      {id:'games',     label:'مدیریت بازی‌ها و لابی‌ها', icon:'game'},
      {id:'economy',   label:'مدیریت اقتصاد و فروشگاه', icon:'wallet'},
      {id:'reports',   label:'گزارش‌ها',            icon:'chart'},
      {id:'activity',  label:'گزارش فعالیت‌ها',     icon:'list'},
      {id:'settings',  label:'تنظیمات سیستم',       icon:'sliders'}
    ]
  },
  admin:{
    label:'ادمین', short:'ادمین',
    foot:'ادمین به زیرساخت، مدیریت نقش‌ها و اقتصاد دسترسی ندارد.',
    menus:[
      {id:'dashboard',  label:'داشبورد',              icon:'dashboard'},
      {id:'users',      label:'مدیریت کاربران',        icon:'users'},
      {id:'blocked',    label:'مدیریت مسدودی‌ها',      icon:'lock'},
      {id:'rated',      label:'بازی‌های امتیازی',      icon:'game'},
      {id:'colorcodes', label:'مدیریت کد رنگی لابی',   icon:'layers'},
      {id:'reports',    label:'گزارش‌ها',              icon:'chart'},
      {id:'notifs',     label:'اعلان‌ها',              icon:'bell'}
    ]
  },
  moderator:{
    label:'ناظر', short:'ناظر',
    foot:'ناظر به تنظیمات مالی، کد رنگی لابی و مدیریت نقش‌ها دسترسی ندارد.',
    menus:[
      {id:'dashboard', label:'داشبورد',            icon:'dashboard'},
      {id:'active',    label:'بازی‌های فعال',       icon:'game'},
      {id:'violations',label:'گزارش‌های تخلف',      icon:'alert'},
      {id:'blocked',   label:'کاربران مسدودشده',    icon:'lock'},
      {id:'actions',   label:'سابقه اقدامات',       icon:'history'}
    ]
  },
  support:{
    label:'پشتیبانی', short:'پشتیبانی',
    foot:'پشتیبانی به بازی‌های امتیازی، کد رنگی لابی، تنظیمات سیستم و مدیریت نقش‌ها دسترسی ندارد.',
    menus:[
      {id:'dashboard', label:'داشبورد',            icon:'dashboard'},
      {id:'tickets',   label:'تیکت‌ها',             icon:'ticket'},
      {id:'search',    label:'جستجوی کاربر',        icon:'search'},
      {id:'blocked',   label:'مدیریت مسدودی‌ها',    icon:'lock'},
      {id:'actions',   label:'سابقه اقدامات من',    icon:'history'}
    ]
  }
};

/* مجوزهای عملیاتی هر نقش */
const PERMS = {
  creator:  ['ban','unban','code.approve','code.disable','game.enter','game.players','ticket.reply','user.search','settings','roles','economy'],
  admin:    ['ban','unban','code.approve','code.disable','game.enter','game.players','user.search'],
  moderator:['ban','ban.lobby','game.enter','game.players'],
  support:  ['ticket.reply','user.search','ban','unban','ban.note']
};
const can = a => (PERMS[state.role]||[]).includes(a);

/* =========================================================
   STATE + MOCK DATA
   ========================================================= */
const state = { role:'creator', view:'dashboard' };

const num = n => Number(n).toLocaleString('fa-IR');

const STATUS = {
  active:['فعال','ok'], blocked:['مسدود','danger'], warn:['اخطار','warn'], kicked:['اخراج‌شده','warn'],
  new:['جدید','info'], open:['در حال بررسی','warn'], answered:['پاسخ داده‌شده','ok'], closed:['بسته','neutral'],
  pending:['در انتظار تأیید','warn'], approved:['تأییدشده','ok'], disabled:['غیرفعال','neutral'],
  running:['در حال اجرا','ok'], down:['قطع','danger'], limited:['محدود','warn'],
  high:['بالا','danger'], mid:['متوسط','warn'], low:['پایین','neutral']
};

/* =========================================================
   HELPERS
   ========================================================= */
const table = (cols, rows, emptyText='موردی برای نمایش نیست') => `
  <div class="table-wrap"><table>
    <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.length
      ? rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')
      : `<tr><td class="empty" colspan="${cols.length}">${emptyText}</td></tr>`}</tbody>
  </table></div>`;

const panel = (title, body, actions='', flush=false) => `
  <section class="panel">
    <header class="panel-head"><h2>${title}</h2><div class="spacer"></div>${actions}</header>
    <div class="panel-body ${flush?'flush':''}">${body}</div>
  </section>`;

const kpi = (label, value, hint='', tone='') => `
  <div class="kpi ${tone}">
    <span class="kpi-label">${label}</span>
    <span class="kpi-value">${value}</span>
    ${hint?`<span class="kpi-hint">${hint}</span>`:''}
  </div>`;

const listRows = items => `<div class="list">${items.map(i=>`
  <div class="list-row">
    <span class="dot ${i.tone||''}"></span>
    <div class="list-main"><strong>${i.title}</strong><span>${i.meta||''}</span></div>
    <span class="list-time">${i.time||''}</span>
  </div>`).join('')}</div>`;

const denyBtn = txt => `<button class="btn sm" disabled title="برای نقش شما مجاز نیست">${txt}</button>`;
